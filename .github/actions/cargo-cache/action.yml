name: Cargo cache
description: Restores a Cargo cache on every run and saves it only on runs that are not pull requests, so pull requests read main's caches without evicting them.
inputs:
  path:
    description: The paths to cache, one per line.
    required: true
  key:
    description: The exact cache key.
    required: true
  restore-keys:
    description: Key prefixes to fall back to when the exact key is missing.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - if: github.event_name != 'pull_request'
      uses: actions/cache@v5
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
    - if: github.event_name == 'pull_request'
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
