name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  musl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain and the musl target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-musl-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Test against musl, as the default Linux release is built
        run: cargo test --workspace --target x86_64-unknown-linux-musl

  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGETS: >-
        x86_64-unknown-freebsd x86_64-unknown-netbsd x86_64-unknown-illumos x86_64-pc-solaris
        aarch64-unknown-linux-gnu aarch64-linux-android aarch64-apple-ios wasm32-wasip1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain and the cross targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add $TARGETS
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-cross-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Lint the platform layer and the storage engine for each target
        run: |
          for target in $TARGETS; do
            cargo clippy -p eggdb-platform -p eggdb-storage --all-targets --target "$target" -- -D warnings
          done
