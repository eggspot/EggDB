name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Check the shipped crates are only our own
        run: |
          set -o pipefail
          shipped=$(cargo tree -p eggdb -e normal,build --target all --prefix none --format '{p}' \
            | awk '{print $1}' | sort -u)
          if [ -z "$shipped" ]; then
            echo "::error::cargo tree listed no crates for eggdb"
            exit 1
          fi
          foreign=$(echo "$shipped" | grep -v -E '^eggdb(-[a-z]+)?$' || true)
          if [ -n "$foreign" ]; then
            echo "::error::third-party crates in what ships (D1): $foreign"
            exit 1
          fi
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Install psql, mysql and the pg8000 and PyMySQL drivers for the smoke test (test tooling, never shipped)
        run: |
          command -v psql || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          command -v mysql || { sudo apt-get update && sudo apt-get install -y mysql-client; }
          python3 -m venv "$RUNNER_TEMP/pg-driver"
          "$RUNNER_TEMP/pg-driver/bin/pip" install --quiet pg8000==1.31.2 PyMySQL==1.1.1
          echo "EGGDB_SMOKE_PYTHON=$RUNNER_TEMP/pg-driver/bin/python" >> "$GITHUB_ENV"
      - name: Smoke test the eggdb command
        run: cargo build -p eggdb && scripts/smoke-test.sh target/debug/eggdb
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Smoke test the eggdb command
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          cargo build -p eggdb
          scripts/smoke-test.sh "target/debug/eggdb$exe"

  musl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain and the musl target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-musl-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Test against musl, as the default Linux release is built
        run: cargo test --workspace --target x86_64-unknown-linux-musl

  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGETS: >-
        x86_64-unknown-freebsd x86_64-unknown-netbsd x86_64-unknown-illumos x86_64-pc-solaris
        aarch64-unknown-linux-gnu aarch64-linux-android aarch64-apple-ios wasm32-wasip1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain and the cross targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add $TARGETS
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-cross-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Lint the platform layer, the storage engine, SQL, the PostgreSQL and MySQL servers and the embedded API for each target
        run: |
          for target in $TARGETS; do
            cargo clippy -p eggdb-platform -p eggdb-storage -p eggdb-sql -p eggdb-crypto -p eggdb-pgwire -p eggdb-mysqlwire -p eggdb --all-targets --target "$target" -- -D warnings
          done

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-bench-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Benchmarks against the committed baseline
        run: |
          mkdir -p bench-results
          cargo run --release -p eggdb-bench -- --results bench-results/eggdb-bench.txt
      - name: Keep the benchmark results of this change
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'push' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: bench-results/
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPARE_MANIFEST: crates/eggdb-sqlite-compare/Cargo.toml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/eggdb-sqlite-compare/target
          key: cargo-compare-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'crates/eggdb-sqlite-compare/Cargo.lock') }}
      - name: Format
        run: cargo fmt --manifest-path "$COMPARE_MANIFEST" --check
      - name: Lint
        run: cargo clippy --manifest-path "$COMPARE_MANIFEST" --release --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path "$COMPARE_MANIFEST" --release --locked
      - name: EggDB against SQLite, against the committed baseline
        run: |
          mkdir -p compare-results
          cargo run --manifest-path "$COMPARE_MANIFEST" --release --locked -- --results compare-results/eggdb-sqlite-compare.txt
      - name: Keep the SQLite comparison results of this change
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sqlite-compare-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'push' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: compare-results/
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

  check:
    needs: [lint-and-test, platforms, musl, cross, bench, compare]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Fail when a job failed or was cancelled
        run: |
          echo "results of the jobs: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
