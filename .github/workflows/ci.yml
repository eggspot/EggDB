name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Check the shipped crates are only our own
        run: |
          set -o pipefail
          shipped=$(cargo tree -p eggdb -p eggdb-capi -e normal,build --target all --prefix none --format '{p}' \
            | awk '{print $1}' | sort -u)
          if [ -z "$shipped" ]; then
            echo "::error::cargo tree listed no crates for eggdb"
            exit 1
          fi
          foreign=$(echo "$shipped" | grep -v -E '^eggdb(-[a-z]+)?$' || true)
          if [ -n "$foreign" ]; then
            echo "::error::third-party crates in what ships (D1): $foreign"
            exit 1
          fi
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Install psql, mysql and the pg8000 and PyMySQL drivers for the smoke test (test tooling, never shipped)
        run: |
          command -v psql || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          command -v mysql || { sudo apt-get update && sudo apt-get install -y mysql-client; }
          python3 -m venv "$RUNNER_TEMP/pg-driver"
          "$RUNNER_TEMP/pg-driver/bin/pip" install --quiet pg8000==1.31.2 PyMySQL==1.1.1
          echo "EGGDB_SMOKE_PYTHON=$RUNNER_TEMP/pg-driver/bin/python" >> "$GITHUB_ENV"
      - name: Download go-sqlcmd v1.10.0 (MIT) for the smoke test, checked against its SHA-256 (test tooling, never shipped)
        run: |
          mkdir -p "$RUNNER_TEMP/go-sqlcmd"
          cd "$RUNNER_TEMP/go-sqlcmd"
          curl --retry 3 -fsSL -o sqlcmd-linux-amd64.tar.bz2 https://github.com/microsoft/go-sqlcmd/releases/download/v1.10.0/sqlcmd-linux-amd64.tar.bz2
          echo "92516d98c63d99b0994de5b61350c91f6915f9b76f139a59039fbcb225c2e987  sqlcmd-linux-amd64.tar.bz2" | sha256sum -c -
          tar -xjf sqlcmd-linux-amd64.tar.bz2
          tool=$(find "$PWD" -maxdepth 2 -type f -name sqlcmd | head -n 1)
          [ -n "$tool" ] || { echo "::error::no sqlcmd in the go-sqlcmd archive"; exit 1; }
          "$tool" --version
          echo "EGGDB_SMOKE_SQLCMD=$tool" >> "$GITHUB_ENV"
      - name: Smoke test the eggdb command
        run: cargo build -p eggdb && scripts/smoke-test.sh target/debug/eggdb
      - name: Check the C API from C, C++ and Python
        run: cargo build -p eggdb-capi && scripts/c-api/check.sh target/debug "$RUNNER_TEMP/c-api"
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Smoke test the eggdb command
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          cargo build -p eggdb
          scripts/smoke-test.sh "target/debug/eggdb$exe"
      - name: Check the C API from C, C++ and Python (from Python alone on Windows)
        run: |
          cargo build -p eggdb-capi
          if [ "$RUNNER_OS" = Windows ]; then export NO_C_COMPILER=1 PYTHON=python; fi
          scripts/c-api/check.sh target/debug "$(mktemp -d)"

  musl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain and the musl target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-musl-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Test against musl, as the default Linux release is built
        run: cargo test --workspace --target x86_64-unknown-linux-musl

  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGETS: >-
        x86_64-unknown-freebsd x86_64-unknown-netbsd x86_64-unknown-illumos x86_64-pc-solaris
        aarch64-unknown-linux-gnu aarch64-linux-android aarch64-apple-ios wasm32-wasip1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain and the cross targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add $TARGETS
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-cross-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Lint the platform layer, the storage engine, SQL, the PostgreSQL, MySQL, SQL Server and MCP servers, the command registry and the embedded API for each target
        run: |
          for target in $TARGETS; do
            cargo clippy -p eggdb-platform -p eggdb-storage -p eggdb-sql -p eggdb-crypto -p eggdb-tls -p eggdb-pgwire -p eggdb-mysqlwire -p eggdb-commands -p eggdb-mcp -p eggdb-tdswire -p eggdb --all-targets --target "$target" -- -D warnings
          done

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-bench-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Benchmarks against the committed baseline
        run: |
          mkdir -p bench-results
          cargo run --release -p eggdb-bench -- --results bench-results/eggdb-bench.txt
      - name: Keep the benchmark results of this change
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'push' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: bench-results/
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      COMPARE_MANIFEST: crates/eggdb-sqlite-compare/Cargo.toml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/eggdb-sqlite-compare/target
          key: cargo-compare-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'crates/eggdb-sqlite-compare/Cargo.lock') }}
      - name: Format
        run: cargo fmt --manifest-path "$COMPARE_MANIFEST" --check
      - name: Lint
        run: cargo clippy --manifest-path "$COMPARE_MANIFEST" --release --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path "$COMPARE_MANIFEST" --release --locked
      - name: EggDB against SQLite, against the committed baseline
        run: |
          mkdir -p compare-results
          cargo run --manifest-path "$COMPARE_MANIFEST" --release --locked -- --results compare-results/eggdb-sqlite-compare.txt
      - name: Keep the SQLite comparison results of this change
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sqlite-compare-${{ runner.os }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'push' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: compare-results/
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

  pg-restore:
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-pg-restore-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Build eggdb
        run: cargo build -p eggdb
      - name: Start the official postgres:${{ matrix.postgres }} container (test oracle only, never shipped)
        run: |
          docker run -d --name pg --network host -e POSTGRES_HOST_AUTH_METHOD=trust "postgres:${{ matrix.postgres }}"
          for _ in $(seq 1 60); do
            docker exec pg pg_isready -h 127.0.0.1 -U postgres -q && break
            sleep 1
          done
          docker exec pg pg_isready -h 127.0.0.1 -U postgres
      - name: Dump the fixture plain, with inserts and as an archive, restore each into EggDB and compare every table
        env:
          PG_CONTAINER: pg
          PGHOST: 127.0.0.1
          PGUSER: postgres
        run: scripts/pg-restore/check.sh target/debug/eggdb "$RUNNER_TEMP/pg-restore" --rows 50000

  pg-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-pg-catalog-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Start the official postgres:16 container and pull psql 17 (test oracles only, never shipped)
        run: |
          docker run -d --name pg --network host -e POSTGRES_USER=eggdb -e POSTGRES_PASSWORD=catalog-oracle \
            -e POSTGRES_DB=eggdb -e POSTGRES_INITDB_ARGS="--locale=C --encoding=UTF8" postgres:16
          docker pull -q postgres:17
      - name: Build eggdb
        run: cargo build -p eggdb
      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 60); do
            docker exec pg pg_isready -h 127.0.0.1 -U eggdb -q && break
            sleep 1
          done
          docker exec pg pg_isready -h 127.0.0.1 -U eggdb
      - name: Show the fixture with psql 17 on PostgreSQL 16 and on EggDB and compare the bytes
        env:
          PG_CONTAINER: pg
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: eggdb
          PGPASSWORD: catalog-oracle
          PSQL: docker run --rm -i --network host -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGTZ -e PGCLIENTENCODING postgres:17 psql
        run: scripts/pg-catalog/check.sh target/debug/eggdb "$RUNNER_TEMP/pg-catalog"
      - name: Keep the queries psql 17 sent, its outputs and any difference
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-catalog-psql17-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'push' }}-${{ github.event.pull_request.head.sha || github.sha }}
          overwrite: true
          path: |
            ${{ runner.temp }}/pg-catalog/*.queries.log
            ${{ runner.temp }}/pg-catalog/*.oids
            ${{ runner.temp }}/pg-catalog/*.out
            ${{ runner.temp }}/pg-catalog/output.diff
          retention-days: 7
          if-no-files-found: ignore

  pg-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-pg-functions-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Start the official postgres:17 container (test oracle only, never shipped)
        run: docker run -d --name pg --network host -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17
      - name: Build eggdb
        run: cargo build -p eggdb
      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 60); do
            docker exec pg pg_isready -h 127.0.0.1 -U postgres -q && break
            sleep 1
          done
          docker exec pg pg_isready -h 127.0.0.1 -U postgres
      - name: Run the function cases with psql on PostgreSQL 17 and on EggDB and compare the bytes
        env:
          PG_CONTAINER: pg
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
        run: scripts/pg-functions/check.sh target/debug/eggdb "$RUNNER_TEMP/pg-functions"
      - name: Run the query cases (windows, LATERAL, data-modifying WITH, views, temporary tables) the same way
        if: always()
        env:
          PG_CONTAINER: pg
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
        run: scripts/pg-functions/check.sh target/debug/eggdb "$RUNNER_TEMP/pg-queries" scripts/pg-queries/cases.sql
      - name: Keep both outputs and any difference
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-functions-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'push' }}-${{ github.event.pull_request.head.sha || github.sha }}
          overwrite: true
          path: |
            ${{ runner.temp }}/pg-functions/*.out
            ${{ runner.temp }}/pg-functions/*.err
            ${{ runner.temp }}/pg-functions/output.diff
            ${{ runner.temp }}/pg-queries/*.out
            ${{ runner.temp }}/pg-queries/*.err
            ${{ runner.temp }}/pg-queries/output.diff
          retention-days: 7
          if-no-files-found: ignore

  pg-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.nuget/packages
            target
          key: cargo-pg-apps-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'crates/eggdb/tests/clients/dotnet/NpgsqlAppCheck/NpgsqlAppCheck.csproj') }}
      - name: Start the official postgres:17 container (test oracle only, never shipped)
        run: |
          docker run -d --name pg --network host -e POSTGRES_USER=eggdb -e POSTGRES_PASSWORD=apps-oracle \
            -e POSTGRES_DB=eggdb -e POSTGRES_INITDB_ARGS="--locale=C --encoding=UTF8" postgres:17
      - name: Install pgjdbc, psycopg 3, SQLAlchemy and Flyway Community (Apache-2.0) with its jackson jars (test clients only, never shipped)
        run: |
          mkdir -p "$RUNNER_TEMP/clients/flyway"
          curl --retry 3 -fsSL -o "$RUNNER_TEMP/clients/postgresql.jar" \
            https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
          for jar in \
            org/flywaydb/flyway-core/10.20.1/flyway-core-10.20.1.jar \
            org/flywaydb/flyway-database-postgresql/10.20.1/flyway-database-postgresql-10.20.1.jar \
            com/fasterxml/jackson/dataformat/jackson-dataformat-toml/2.15.2/jackson-dataformat-toml-2.15.2.jar \
            com/fasterxml/jackson/datatype/jackson-datatype-jsr310/2.15.2/jackson-datatype-jsr310-2.15.2.jar \
            com/fasterxml/jackson/core/jackson-databind/2.15.2/jackson-databind-2.15.2.jar \
            com/fasterxml/jackson/core/jackson-core/2.15.2/jackson-core-2.15.2.jar \
            com/fasterxml/jackson/core/jackson-annotations/2.15.2/jackson-annotations-2.15.2.jar; do
            curl --retry 3 -fsSL -o "$RUNNER_TEMP/clients/flyway/$(basename "$jar")" "https://repo1.maven.org/maven2/$jar"
          done
          python3 -m venv "$RUNNER_TEMP/clients/venv"
          "$RUNNER_TEMP/clients/venv/bin/pip" install --quiet "psycopg[binary]==3.2.3" "SQLAlchemy==2.0.36"
      - name: Build eggdb
        run: cargo build -p eggdb
      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 60); do
            docker exec pg pg_isready -h 127.0.0.1 -U eggdb -q && break
            sleep 1
          done
          docker exec pg pg_isready -h 127.0.0.1 -U eggdb
      - name: Run pgjdbc, psycopg 3, SQLAlchemy Core and ORM, Npgsql (PostgreSQL License; restored from NuGet, never shipped) and Flyway on PostgreSQL 17 and on EggDB and compare the bytes
        env:
          PG_CONTAINER: pg
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: eggdb
          PGPASSWORD: apps-oracle
          PGJDBC_JAR: ${{ runner.temp }}/clients/postgresql.jar
          PYTHON: ${{ runner.temp }}/clients/venv/bin/python
        run: |
          FLYWAY_CLASSPATH="$PGJDBC_JAR$(printf ':%s' "$RUNNER_TEMP"/clients/flyway/*.jar)" \
            scripts/pg-apps/check.sh target/debug/eggdb "$RUNNER_TEMP/pg-apps"
      - name: Keep both outputs and any difference
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-apps-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'push' }}-${{ github.event.pull_request.head.sha || github.sha }}
          overwrite: true
          path: |
            ${{ runner.temp }}/pg-apps/*.out
            ${{ runner.temp }}/pg-apps/*.flyway.err
            ${{ runner.temp }}/pg-apps/serve.err
            ${{ runner.temp }}/pg-apps/output.diff
            ${{ runner.temp }}/pg-apps/dotnet-build.log
          retention-days: 7
          if-no-files-found: ignore

  tds-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.nuget/packages
            target
          key: cargo-tds-apps-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'crates/eggdb/tests/clients/dotnet/TdsAppCheck/TdsAppCheck.csproj', 'crates/eggdb/tests/clients/dotnet/EfCoreAppCheck/EfCoreAppCheck.csproj') }}
      - name: Download mssql-jdbc (MIT; test client only, never shipped)
        run: |
          mkdir -p "$RUNNER_TEMP/clients"
          curl --retry 3 -fsSL -o "$RUNNER_TEMP/clients/mssql-jdbc.jar" \
            https://repo1.maven.org/maven2/com/microsoft/sqlserver/mssql-jdbc/12.8.1.jre11/mssql-jdbc-12.8.1.jre11.jar
      - name: Build eggdb
        run: cargo build -p eggdb
      - name: Run mssql-jdbc, Microsoft.Data.SqlClient and EF Core (MIT; restored from NuGet, never shipped) against eggdb serve --tds-listen
        env:
          MSSQL_JDBC_JAR: ${{ runner.temp }}/clients/mssql-jdbc.jar
        run: scripts/tds-apps/check.sh target/debug/eggdb "$RUNNER_TEMP/tds-apps"
      - name: Keep the outputs, the server log and any difference
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tds-apps-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'push' }}-${{ github.event.pull_request.head.sha || github.sha }}
          overwrite: true
          path: |
            ${{ runner.temp }}/tds-apps/*.out
            ${{ runner.temp }}/tds-apps/serve.err
            ${{ runner.temp }}/tds-apps/output.diff
            ${{ runner.temp }}/tds-apps/dotnet-build.log
          retention-days: 7
          if-no-files-found: ignore

  oracle-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-oracle-apps-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Download pgjdbc and pull the postgres:17 image for psql (test clients only, never shipped)
        run: |
          mkdir -p "$RUNNER_TEMP/clients"
          curl --retry 3 -fsSL -o "$RUNNER_TEMP/clients/postgresql.jar" \
            https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
          docker pull --quiet postgres:17
      - name: Build eggdb
        run: cargo build -p eggdb
      - name: Run HR's queries in Oracle's dialect through psql and pgjdbc against eggdb serve
        env:
          PSQL: docker run --rm -i --network host -e PGPASSWORD -e PGOPTIONS postgres:17 psql
          PGJDBC_JAR: ${{ runner.temp }}/clients/postgresql.jar
        run: scripts/oracle-apps/check.sh target/debug/eggdb "$RUNNER_TEMP/oracle-apps"
      - name: Keep the outputs, the server log and any difference
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-apps-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'push' }}-${{ github.event.pull_request.head.sha || github.sha }}
          overwrite: true
          path: |
            ${{ runner.temp }}/oracle-apps/*.out
            ${{ runner.temp }}/oracle-apps/serve.err
            ${{ runner.temp }}/oracle-apps/output.diff
          retention-days: 7
          if-no-files-found: ignore

  tls-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-tls-clients-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Get psql 17 (postgres:17 image), the mysql client and go-sqlcmd v1.10.0 (MIT), checked against its SHA-256 (test clients only, never shipped)
        run: |
          docker pull --quiet postgres:17
          command -v mysql || { sudo apt-get update && sudo apt-get install -y mysql-client; }
          mkdir -p "$RUNNER_TEMP/go-sqlcmd"
          cd "$RUNNER_TEMP/go-sqlcmd"
          curl --retry 3 -fsSL -o sqlcmd-linux-amd64.tar.bz2 https://github.com/microsoft/go-sqlcmd/releases/download/v1.10.0/sqlcmd-linux-amd64.tar.bz2
          echo "92516d98c63d99b0994de5b61350c91f6915f9b76f139a59039fbcb225c2e987  sqlcmd-linux-amd64.tar.bz2" | sha256sum -c -
          tar -xjf sqlcmd-linux-amd64.tar.bz2
          tool=$(find "$PWD" -maxdepth 2 -type f -name sqlcmd | head -n 1)
          [ -n "$tool" ] || { echo "::error::no sqlcmd in the go-sqlcmd archive"; exit 1; }
          echo "SQLCMD=$tool" >> "$GITHUB_ENV"
      - name: Build eggdb
        run: cargo build -p eggdb
      - name: Connect psql, mysql and sqlcmd to eggdb serve over TLS
        run: |
          mkdir -p "$RUNNER_TEMP/tls-clients"
          PSQL="docker run --rm -i --network host -v $RUNNER_TEMP/tls-clients:$RUNNER_TEMP/tls-clients -e PGPASSWORD postgres:17 psql" \
            scripts/tls-clients/check.sh target/debug/eggdb "$RUNNER_TEMP/tls-clients"
      - name: Keep the server log and client outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tls-clients-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'push' }}-${{ github.event.pull_request.head.sha || github.sha }}
          overwrite: true
          path: |
            ${{ runner.temp }}/tls-clients/*.out
            ${{ runner.temp }}/tls-clients/*.err
          retention-days: 7
          if-no-files-found: ignore

  pg-follow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-pg-follow-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Pull the postgres:17 image (a test source, never shipped)
        run: docker pull --quiet postgres:17
      - name: Build eggdb
        run: cargo build -p eggdb
      - name: Follow a running PostgreSQL 17 while it takes writes, then compare
        run: scripts/pg-follow/check.sh target/debug/eggdb "$RUNNER_TEMP/pg-follow"
      - name: Keep the follow log and any difference
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-follow-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'push' }}-${{ github.event.pull_request.head.sha || github.sha }}
          overwrite: true
          path: |
            ${{ runner.temp }}/pg-follow/*.out
            ${{ runner.temp }}/pg-follow/*.err
            ${{ runner.temp }}/pg-follow/output.diff
          retention-days: 7
          if-no-files-found: ignore

  sqlalchemy-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-sqlalchemy-suite-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Build eggdb
        run: cargo build -p eggdb
      - name: Run SQLAlchemy's dialect compliance suite (MIT, a test tool, never shipped) against eggdb serve
        run: scripts/sqlalchemy-suite/check.sh target/debug/eggdb "$RUNNER_TEMP/sqlalchemy-suite"
      - name: Keep the suite's report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sqlalchemy-suite-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'push' }}-${{ github.event.pull_request.head.sha || github.sha }}
          overwrite: true
          path: |
            ${{ runner.temp }}/sqlalchemy-suite/pytest.out
            ${{ runner.temp }}/sqlalchemy-suite/serve.err
          retention-days: 7
          if-no-files-found: ignore

  unix-vms:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [freebsd, netbsd, omnios]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Test the platform layer, the storage engine and the embedded API natively in ${{ matrix.os }} (a VM through vmactions, MIT, test tooling only)
        uses: vmactions/${{ matrix.os }}-vm@v1
        with:
          usesh: true
          prepare: |
            case "${{ matrix.os }}" in
              freebsd) pkg install -y curl bash ;;
              netbsd) /usr/sbin/pkg_add curl bash ;;
              omnios) pkg install curl gcc13 || true ;;
            esac
          run: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            . "$HOME/.cargo/env"
            rustup toolchain install
            cargo test -p eggdb-platform -p eggdb-storage -p eggdb --lib

  check:
    needs: [lint-and-test, platforms, musl, cross, bench, compare, pg-restore, pg-catalog, pg-functions, pg-apps, tds-apps, oracle-apps, tls-clients, pg-follow, sqlalchemy-suite, unix-vms]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Fail when a job failed or was cancelled
        run: |
          echo "results of the jobs: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
