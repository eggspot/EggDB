    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-tls-clients-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Get psql 17 (postgres:17 image), the mysql client and go-sqlcmd v1.10.0 (MIT), checked against its SHA-256 (test clients only, never shipped)
        run: |
          docker pull --quiet postgres:17
          command -v mysql || { sudo apt-get update && sudo apt-get install -y mysql-client; }
          mkdir -p "$RUNNER_TEMP/go-sqlcmd"
          cd "$RUNNER_TEMP/go-sqlcmd"
          curl --retry 3 -fsSL -o sqlcmd-linux-amd64.tar.bz2 https://github.com/microsoft/go-sqlcmd/releases/download/v1.10.0/sqlcmd-linux-amd64.tar.bz2
          echo "92516d98c63d99b0994de5b61350c91f6915f9b76f139a59039fbcb225c2e987  sqlcmd-linux-amd64.tar.bz2" | sha256sum -c -
          tar -xjf sqlcmd-linux-amd64.tar.bz2
          tool=$(find "$PWD" -maxdepth 2 -type f -name sqlcmd | head -n 1)
          [ -n "$tool" ] || { echo "::error::no sqlcmd in the go-sqlcmd archive"; exit 1; }
          echo "SQLCMD=$tool" >> "$GITHUB_ENV"
      - name: Build eggdb
        run: cargo build -p eggdb
      - name: Connect psql, mysql and sqlcmd to eggdb serve over TLS
        run: |
          mkdir -p "$RUNNER_TEMP/tls-clients"
          PSQL="docker run --rm -i --network host -v $RUNNER_TEMP/tls-clients:$RUNNER_TEMP/tls-clients -e PGPASSWORD postgres:17 psql" \
            scripts/tls-clients/check.sh target/debug/eggdb "$RUNNER_TEMP/tls-clients"
      - name: Keep the server log and client outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tls-clients-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'push' }}-${{ github.event.pull_request.head.sha || github.sha }}
          overwrite: true
          path: |
            ${{ runner.temp }}/tls-clients/*.out
            ${{ runner.temp }}/tls-clients/*.err
          retention-days: 7
          if-no-files-found: ignore

  pg-follow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-pg-follow-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Pull the postgres:17 image (a test source, never shipped)
        run: docker pull --quiet postgres:17
      - name: Build eggdb
        run: cargo build -p eggdb
      - name: Follow a running PostgreSQL 17 while it takes writes, then compare
        run: scripts/pg-follow/check.sh target/debug/eggdb "$RUNNER_TEMP/pg-follow"
      - name: Keep the follow log and any difference
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-follow-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'push' }}-${{ github.event.pull_request.head.sha || github.sha }}
          overwrite: true
          path: |
            ${{ runner.temp }}/pg-follow/*.out
            ${{ runner.temp }}/pg-follow/*.err
            ${{ runner.temp }}/pg-follow/output.diff
          retention-days: 7
          if-no-files-found: ignore

  sqlalchemy-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-sqlalchemy-suite-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Build eggdb
        run: cargo build -p eggdb
      - name: Run SQLAlchemy's dialect compliance suite (MIT, a test tool, never shipped) against eggdb serve
        run: scripts/sqlalchemy-suite/check.sh target/debug/eggdb "$RUNNER_TEMP/sqlalchemy-suite"
      - name: Keep the suite's report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sqlalchemy-suite-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'push' }}-${{ github.event.pull_request.head.sha || github.sha }}
          overwrite: true
          path: |
            ${{ runner.temp }}/sqlalchemy-suite/pytest.out
            ${{ runner.temp }}/sqlalchemy-suite/serve.err
          retention-days: 7
          if-no-files-found: ignore

  unix-vms:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [freebsd, netbsd, omnios]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Test the platform layer, the storage engine and the embedded API natively in ${{ matrix.os }} (a VM through vmactions, MIT, test tooling only)
        uses: vmactions/${{ matrix.os }}-vm@v1
        with:
          usesh: true
          prepare: |
            case "${{ matrix.os }}" in
              freebsd) pkg install -y curl bash ;;
              netbsd) /usr/sbin/pkg_add curl bash ;;
              omnios) pkg install curl gcc13 || true ;;
            esac
          run: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            . "$HOME/.cargo/env"
            rustup toolchain install
            cargo test -p eggdb-platform -p eggdb-storage -p eggdb --lib

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain and the WASI target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-wasip1
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-browser-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Build EggDB for WebAssembly and run it under Node and in headless Chrome
        run: |
          cargo build --release -p eggdb-wasm --target wasm32-wasip1
          cp target/wasm32-wasip1/release/eggdb_wasm.wasm web/eggdb.wasm
          ls -l web/eggdb.wasm
          node web/test.mjs web/eggdb.wasm
          python3 -m http.server 8000 --bind 127.0.0.1 --directory web &
          for attempt in $(seq 1 50); do curl -sf http://127.0.0.1:8000/test.html > /dev/null && break; sleep 0.2; done
          google-chrome --headless=new --disable-gpu --no-sandbox --virtual-time-budget=30000 --dump-dom http://127.0.0.1:8000/test.html > "$RUNNER_TEMP/dom.html"
          cat "$RUNNER_TEMP/dom.html"
          grep -q "eggdb-browser-test: passed" "$RUNNER_TEMP/dom.html"

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-mobile-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Check the Kotlin binding (JNI over the C API) on the JVM
        run: |
          command -v kotlinc || { echo "::error::kotlinc is not installed on this runner"; exit 1; }
          cargo build -p eggdb-capi
          mkdir -p "$RUNNER_TEMP/kotlin"
          gcc -shared -fPIC -Wall -Werror -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" -Icrates/eggdb-capi/include drivers/kotlin/jni/eggdb_jni.c -Ltarget/debug -leggdb_capi -Wl,-rpath,"$PWD/target/debug" -o "$RUNNER_TEMP/kotlin/libeggdb_jni.so"
          kotlinc drivers/kotlin/src drivers/kotlin/check/Check.kt -include-runtime -d "$RUNNER_TEMP/kotlin/check.jar"
          java -Djava.library.path="$RUNNER_TEMP/kotlin" -jar "$RUNNER_TEMP/kotlin/check.jar"

  apple-mobile:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-apple-mobile-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Build the C API as an XCFramework for iOS, the iOS simulator and macOS
        run: scripts/apple/xcframework.sh "$RUNNER_TEMP/EggDB.xcframework"

  other-cpus:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-unknown-linux-gnu
            packages: gcc-multilib
            runner: ""
          - target: armv7-unknown-linux-gnueabihf
            packages: gcc-arm-linux-gnueabihf qemu-user
            runner: qemu-arm -L /usr/arm-linux-gnueabihf
            linker: arm-linux-gnueabihf-gcc
          - target: s390x-unknown-linux-gnu
            packages: gcc-s390x-linux-gnu qemu-user
            runner: qemu-s390x -L /usr/s390x-linux-gnu
            linker: s390x-linux-gnu-gcc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain, the target, its linker and QEMU
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
          sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Test the file format, the storage engine, cryptography and columnar encodings on ${{ matrix.target }}
        env:
          TARGET_ENV: ${{ matrix.target }}
          LINKER: ${{ matrix.linker }}
          RUNNER: ${{ matrix.runner }}
        run: |
          upper=$(echo "$TARGET_ENV" | tr 'a-z-' 'A-Z_')
          if [ -n "$LINKER" ]; then export "CARGO_TARGET_${upper}_LINKER=$LINKER"; fi
          if [ -n "$RUNNER" ]; then export "CARGO_TARGET_${upper}_RUNNER=$RUNNER"; fi
          cargo test --target "$TARGET_ENV" -p eggdb-format -p eggdb-storage -p eggdb-crypto -p eggdb-columnar

  deploy-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Check the AWS, Azure and Google Cloud templates (test tools only, never shipped)
        run: |
          python3 -m venv "$RUNNER_TEMP/cfn"
          "$RUNNER_TEMP/cfn/bin/pip" install --quiet cfn-lint==1.20.0
          "$RUNNER_TEMP/cfn/bin/cfn-lint" deploy/aws/eggdb.yaml
          az bicep build --file deploy/azure/main.bicep --stdout > /dev/null
          shellcheck deploy/gcp/deploy.sh scripts/apple/xcframework.sh

  footprint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-footprint-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Measure each build profile against its budget (D6, D34)
        run: scripts/footprint.sh

  reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build the same commit twice from scratch and compare the binaries
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          export RUSTFLAGS="--remap-path-prefix=$PWD=/eggdb --remap-path-prefix=$HOME=/home"
          cargo build --release -p eggdb --target-dir "$RUNNER_TEMP/first"
          cargo build --release -p eggdb --target-dir "$RUNNER_TEMP/second"
          sha256sum "$RUNNER_TEMP/first/release/eggdb" "$RUNNER_TEMP/second/release/eggdb"
          cmp "$RUNNER_TEMP/first/release/eggdb" "$RUNNER_TEMP/second/release/eggdb"

  check:
    needs: [lint-and-test, platforms, musl, kubernetes, resp-clients, redis-compare, installers, egg-allocator, cross, bench, compare, pg-restore, pg-catalog, pg-functions, pg-apps, tds-apps, oracle-apps, tls-clients, pg-follow, sqlalchemy-suite, unix-vms, browser, mobile, apple-mobile, other-cpus, deploy-templates, footprint, reproducible]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Fail when a job failed or was cancelled
        run: |
          echo "results of the jobs: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
