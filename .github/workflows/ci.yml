name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Check the shipped crates are only our own
        run: |
          set -o pipefail
          shipped=$(cargo tree -p eggdb -p eggdb-capi -e normal,build --target all --prefix none --format '{p}' \
            | awk '{print $1}' | sort -u)
          if [ -z "$shipped" ]; then
            echo "::error::cargo tree listed no crates for eggdb"
            exit 1
          fi
          foreign=$(echo "$shipped" | grep -v -E '^eggdb(-[a-z]+)?$' || true)
          if [ -n "$foreign" ]; then
            echo "::error::third-party crates in what ships (D1): $foreign"
            exit 1
          fi
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Install psql, mysql and the pg8000 and PyMySQL drivers for the smoke test (test tooling, never shipped)
        run: |
          command -v psql || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          command -v mysql || { sudo apt-get update && sudo apt-get install -y mysql-client; }
          python3 -m venv "$RUNNER_TEMP/pg-driver"
          "$RUNNER_TEMP/pg-driver/bin/pip" install --quiet pg8000==1.31.2 PyMySQL==1.1.1
          echo "EGGDB_SMOKE_PYTHON=$RUNNER_TEMP/pg-driver/bin/python" >> "$GITHUB_ENV"
      - name: Download go-sqlcmd v1.10.0 (MIT) for the smoke test, checked against its SHA-256 (test tooling, never shipped)
        run: |
          mkdir -p "$RUNNER_TEMP/go-sqlcmd"
          cd "$RUNNER_TEMP/go-sqlcmd"
          curl --retry 3 -fsSL -o sqlcmd-linux-amd64.tar.bz2 https://github.com/microsoft/go-sqlcmd/releases/download/v1.10.0/sqlcmd-linux-amd64.tar.bz2
          echo "92516d98c63d99b0994de5b61350c91f6915f9b76f139a59039fbcb225c2e987  sqlcmd-linux-amd64.tar.bz2" | sha256sum -c -
          tar -xjf sqlcmd-linux-amd64.tar.bz2
          tool=$(find "$PWD" -maxdepth 2 -type f -name sqlcmd | head -n 1)
          [ -n "$tool" ] || { echo "::error::no sqlcmd in the go-sqlcmd archive"; exit 1; }
          "$tool" --version
          echo "EGGDB_SMOKE_SQLCMD=$tool" >> "$GITHUB_ENV"
      - name: Smoke test the eggdb command
        run: cargo build -p eggdb && scripts/smoke-test.sh target/debug/eggdb
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Check the C API from C, C++ and Python, and the Python, .NET and Java drivers
        run: cargo build -p eggdb-capi && scripts/c-api/check.sh target/debug "$RUNNER_TEMP/c-api"
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Smoke test the eggdb command
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          cargo build -p eggdb
          scripts/smoke-test.sh "target/debug/eggdb$exe"
      - name: Check the C API from C, C++ and Python (from Python alone on Windows)
        run: |
          cargo build -p eggdb-capi
          if [ "$RUNNER_OS" = Windows ]; then export NO_C_COMPILER=1 PYTHON=python; fi
          scripts/c-api/check.sh target/debug "$(mktemp -d)"

  musl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain and the musl target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-musl-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Test against musl, as the default Linux release is built
        run: cargo test --workspace --target x86_64-unknown-linux-musl

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain and the musl target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-musl-release-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Build the static binary and the image
        run: |
          cargo build --release -p eggdb --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/eggdb deploy/eggdb
          docker build -t eggdb:local deploy
      - uses: helm/kind-action@v1
        with:
          cluster_name: eggdb
      - name: Install the chart and query the database through it
        run: |
          kind load docker-image eggdb:local --name eggdb
          helm lint deploy/helm/eggdb --set password=ci-password
          helm install db deploy/helm/eggdb --set password=ci-password --wait --timeout 5m
          kubectl rollout status statefulset/db --timeout=3m
          kubectl port-forward service/db 15432:5432 19187:9187 &
          sleep 3
          PGPASSWORD=ci-password psql "host=127.0.0.1 port=15432 user=eggdb dbname=eggdb sslmode=require" \
            -c "CREATE TABLE t (n integer)" -c "INSERT INTO t VALUES (1)" -c "SELECT count(*) FROM t"
          curl -fsS http://127.0.0.1:19187/metrics | grep -q '^eggdb_up 1'
          kubectl delete pod db-0 --wait
          kubectl rollout status statefulset/db --timeout=3m
          kubectl port-forward service/db 15433:5432 &
          sleep 3
          PGPASSWORD=ci-password psql "host=127.0.0.1 port=15433 user=eggdb dbname=eggdb sslmode=require" \
            -tAc "SELECT count(*) FROM t" | grep -qx 1

  resp-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Install redis-cli, redis-py, pymemcache, opensearch-py and pymongo (test tools only, never shipped)
        run: |
          command -v redis-cli || { sudo apt-get update && sudo apt-get install -y redis-tools; }
          python3 -m venv "$RUNNER_TEMP/resp"
          "$RUNNER_TEMP/resp/bin/pip" install --quiet redis==5.0.8 pymemcache==4.0.0 opensearch-py==2.6.0 pymongo==4.8.0
      - name: Serve a database over RESP and talk to it with redis-cli and redis-py
        run: |
          cargo build -p eggdb
          export EGGDB_PASSWORD=ci-resp-password
          target/debug/eggdb serve "$RUNNER_TEMP/resp.eggdb" --create --resp-listen 127.0.0.1:6380 --memcached-listen 127.0.0.1:11212 --es-listen 127.0.0.1:9201 --mongo-listen 127.0.0.1:27018 &
          for attempt in $(seq 1 50); do redis-cli -p 6380 -a "$EGGDB_PASSWORD" --no-auth-warning PING && break; sleep 0.2; done
          cli() { redis-cli -p 6380 -a "$EGGDB_PASSWORD" --no-auth-warning "$@"; }
          test "$(cli SET greeting hello)" = OK
          test "$(cli GET greeting)" = hello
          test "$(cli INCRBY visits 5)" = 5
          cli HSET user:1 name Ada lang Rust
          test "$(cli HGET user:1 name)" = Ada
          cli RPUSH queue a b c
          test "$(cli LRANGE queue 0 -1 | tr '\n' ' ')" = "a b c "
          cli ZADD board 10 ada 20 grace
          test "$(cli ZRANGE board 0 -1 | tr '\n' ' ')" = "ada grace "
          "$RUNNER_TEMP/resp/bin/python" - <<'PY'
          import redis
          r = redis.Redis(port=6380, password="ci-resp-password", protocol=3)
          assert r.set("k", "v", ex=60)
          assert r.get("k") == b"v"
          assert 0 < r.ttl("k") <= 60
          assert r.hgetall("user:1") == {b"name": b"Ada", b"lang": b"Rust"}
          assert r.smembers("nothing") == set()
          pipe = r.pipeline(transaction=False)
          pipe.incr("n").incr("n").get("n")
          assert pipe.execute() == [1, 2, b"2"]
          print("redis-py over RESP3: passed")
          PY
          "$RUNNER_TEMP/resp/bin/python" - <<'PY'
          from pymemcache.client.base import Client
          client = Client(("127.0.0.1", 11212))
          assert client.set("greeting", b"hello", expire=60)
          assert client.get("greeting") == b"hello"
          assert client.add("greeting", b"x") is False
          client.set("count", b"41")
          assert client.incr("count", 1) == 42
          value, token = client.gets("greeting")
          assert client.cas("greeting", b"bye", token)
          assert client.get_many(["greeting", "missing"]) == {"greeting": b"bye"}
          assert client.delete("greeting")
          print("pymemcache: passed")
          PY
          "$RUNNER_TEMP/resp/bin/python" - <<'PY'
          from opensearchpy import OpenSearch, helpers
          client = OpenSearch(hosts=[{"host": "127.0.0.1", "port": 9201}], http_auth=("eggdb", "ci-resp-password"), use_ssl=False)
          assert client.info()["version"]["number"]
          client.indices.create(index="books", body={"mappings": {"properties": {"title": {"type": "text"}}}})
          assert client.indices.exists(index="books")
          client.index(index="books", id="1", body={"title": "The quick brown fox", "genre": "fable", "pages": 120})
          helpers.bulk(client, [
              {"_index": "books", "_id": "2", "_source": {"title": "Foxes running quickly", "genre": "nature", "pages": 300}},
              {"_index": "books", "_id": "3", "_source": {"title": "A slow turtle", "genre": "fable", "pages": 80}},
          ])
          assert client.get(index="books", id="1")["_source"]["pages"] == 120
          found = client.search(index="books", body={"query": {"match": {"title": "fox"}}})
          assert [hit["_id"] for hit in found["hits"]["hits"]] == ["1", "2"], found
          totals = client.search(index="books", body={"size": 0, "aggs": {"genres": {"terms": {"field": "genre"}}}})
          assert totals["aggregations"]["genres"]["buckets"][0] == {"key": "fable", "doc_count": 2}, totals
          assert client.count(index="books")["count"] == 3
          client.delete(index="books", id="3")
          client.indices.delete(index="books")
          assert not client.indices.exists(index="books")
          print("opensearch-py: passed")
          PY
          "$RUNNER_TEMP/resp/bin/python" - <<'PY'
          from pymongo import MongoClient, ASCENDING, DESCENDING
          client = MongoClient("mongodb://eggdb:ci-resp-password@127.0.0.1:27018/?authSource=admin&directConnection=true")
          db = client.app
          assert client.admin.command("ping")["ok"] == 1.0
          people = db.people
          result = people.insert_many([{"name": "Ada", "age": 36, "tags": ["math"]}, {"name": "Grace", "age": 45, "tags": ["navy", "code"]}, {"name": "Linus", "age": 28}])
          assert len(result.inserted_ids) == 3
          assert people.find_one({"name": "Ada"})["age"] == 36
          assert [p["name"] for p in people.find({"age": {"$gte": 30}}).sort("age", DESCENDING)] == ["Grace", "Ada"]
          assert people.count_documents({"tags": "code"}) == 1
          assert people.update_one({"name": "Linus"}, {"$inc": {"age": 1}, "$push": {"tags": "kernel"}}).modified_count == 1
          assert people.find_one({"name": "Linus"}, {"_id": 0, "age": 1}) == {"age": 29}
          totals = list(people.aggregate([{"$group": {"_id": None, "total": {"$sum": "$age"}}}]))
          assert totals[0]["total"] == 110, totals
          people.create_index([("name", ASCENDING)])
          assert "name_1" in people.index_information()
          assert people.delete_many({"age": {"$lt": 40}}).deleted_count == 2
          assert sorted(db.list_collection_names()) == ["people"]
          db.drop_collection("people")
          print("pymongo: passed")
          PY

  redis-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      COMPARE_MANIFEST: crates/eggdb-redis-compare/Cargo.toml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            crates/eggdb-redis-compare/target
          key: cargo-redis-compare-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'crates/eggdb-redis-compare/Cargo.lock') }}
      - name: Format and lint
        run: |
          cargo fmt --manifest-path "$COMPARE_MANIFEST" --check
          cargo clippy --manifest-path "$COMPARE_MANIFEST" --release --locked --all-targets -- -D warnings
      - name: EggDB against Redis
        run: |
          mkdir -p compare-results
          cargo run --manifest-path "$COMPARE_MANIFEST" --release --locked -- --results compare-results/eggdb-redis-compare.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the Redis comparison results of this change
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redis-compare-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'push' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: compare-results/
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the latest release with the one-line installer and time it
        if: runner.os != 'Windows'
        run: scripts/install/check.sh >> "$GITHUB_STEP_SUMMARY"
      - name: Install the latest release with the PowerShell installer and time it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'eggdb-bin'
          $env:EGGDB_INSTALL_DIR = $dir
          $installing = [System.Diagnostics.Stopwatch]::StartNew()
          ./scripts/install/install.ps1
          $installing.Stop()
          $starting = [System.Diagnostics.Stopwatch]::StartNew()
          & (Join-Path $dir 'eggdb.exe') version
          $starting.Stop()
          "| Step | Seconds |`n|------|--------:|`n| download and install | $([math]::Round($installing.Elapsed.TotalSeconds, 2)) |`n| first start | $([math]::Round($starting.Elapsed.TotalSeconds, 2)) |" >> $env:GITHUB_STEP_SUMMARY

  egg-allocator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-egg-allocator-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Test the eggdb binary and its library with EggDB's own allocator installed
        run: |
          cargo test -p eggdb --features egg-allocator
          cargo build -p eggdb --features egg-allocator
          scripts/smoke-test.sh target/debug/eggdb

  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGETS: >-
        x86_64-unknown-freebsd x86_64-unknown-netbsd x86_64-unknown-illumos x86_64-pc-solaris
        aarch64-unknown-linux-gnu aarch64-linux-android aarch64-apple-ios wasm32-wasip1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain and the cross targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add $TARGETS
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-cross-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Lint the platform layer, the storage engine, SQL, the PostgreSQL, MySQL, SQL Server and MCP servers, the command registry and the embedded API for each target
        run: |
          for target in $TARGETS; do
            cargo clippy -p eggdb-platform -p eggdb-storage -p eggdb-sql -p eggdb-crypto -p eggdb-tls -p eggdb-pgwire -p eggdb-mysqlwire -p eggdb-commands -p eggdb-mcp -p eggdb-tdswire -p eggdb --all-targets --target "$target" -- -D warnings
          done

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-bench-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Benchmarks against the committed baseline
        run: |
          mkdir -p bench-results
          cargo run --release -p eggdb-bench -- --results bench-results/eggdb-bench.txt
      - name: Keep the benchmark results of this change
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'push' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: bench-results/
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      COMPARE_MANIFEST: crates/eggdb-sqlite-compare/Cargo.toml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/eggdb-sqlite-compare/target
          key: cargo-compare-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'crates/eggdb-sqlite-compare/Cargo.lock') }}
      - name: Format
        run: cargo fmt --manifest-path "$COMPARE_MANIFEST" --check
      - name: Lint
        run: cargo clippy --manifest-path "$COMPARE_MANIFEST" --release --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path "$COMPARE_MANIFEST" --release --locked
      - name: EggDB against SQLite, against the committed baseline
        run: |
          mkdir -p compare-results
          cargo run --manifest-path "$COMPARE_MANIFEST" --release --locked -- --results compare-results/eggdb-sqlite-compare.txt
      - name: Keep the SQLite comparison results of this change
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sqlite-compare-${{ runner.os }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'push' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: compare-results/
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

  pg-restore:
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-pg-restore-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Build eggdb
        run: cargo build -p eggdb
      - name: Start the official postgres:${{ matrix.postgres }} container (test oracle only, never shipped)
        run: |
          docker run -d --name pg --network host -e POSTGRES_HOST_AUTH_METHOD=trust "postgres:${{ matrix.postgres }}"
          for _ in $(seq 1 60); do
            docker exec pg pg_isready -h 127.0.0.1 -U postgres -q && break
            sleep 1
          done
          docker exec pg pg_isready -h 127.0.0.1 -U postgres
      - name: Dump the fixture plain, with inserts and as an archive, restore each into EggDB and compare every table
        env:
          PG_CONTAINER: pg
          PGHOST: 127.0.0.1
          PGUSER: postgres
        run: scripts/pg-restore/check.sh target/debug/eggdb "$RUNNER_TEMP/pg-restore" --rows 50000

  pg-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-pg-catalog-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Start the official postgres:16 container and pull psql 17 (test oracles only, never shipped)
        run: |
          docker run -d --name pg --network host -e POSTGRES_USER=eggdb -e POSTGRES_PASSWORD=catalog-oracle \
            -e POSTGRES_DB=eggdb -e POSTGRES_INITDB_ARGS="--locale=C --encoding=UTF8" postgres:16
          docker pull -q postgres:17
      - name: Build eggdb
        run: cargo build -p eggdb
      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 60); do
            docker exec pg pg_isready -h 127.0.0.1 -U eggdb -q && break
            sleep 1
          done
          docker exec pg pg_isready -h 127.0.0.1 -U eggdb
      - name: Show the fixture with psql 17 on PostgreSQL 16 and on EggDB and compare the bytes
        env:
          PG_CONTAINER: pg
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: eggdb
          PGPASSWORD: catalog-oracle
          PSQL: docker run --rm -i --network host -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGTZ -e PGCLIENTENCODING postgres:17 psql
        run: scripts/pg-catalog/check.sh target/debug/eggdb "$RUNNER_TEMP/pg-catalog"
