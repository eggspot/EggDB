name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Check the shipped crates are only our own
        run: |
          set -o pipefail
          shipped=$(cargo tree -p eggdb -e normal,build --target all --prefix none --format '{p}' \
            | awk '{print $1}' | sort -u)
          if [ -z "$shipped" ]; then
            echo "::error::cargo tree listed no crates for eggdb"
            exit 1
          fi
          foreign=$(echo "$shipped" | grep -v -E '^eggdb(-[a-z]+)?$' || true)
          if [ -n "$foreign" ]; then
            echo "::error::third-party crates in what ships (D1): $foreign"
            exit 1
          fi
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Smoke test the eggdb command
        run: cargo build -p eggdb && scripts/smoke-test.sh target/debug/eggdb
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Smoke test the eggdb command
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          cargo build -p eggdb
          scripts/smoke-test.sh "target/debug/eggdb$exe"

  musl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain and the musl target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-musl-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Test against musl, as the default Linux release is built
        run: cargo test --workspace --target x86_64-unknown-linux-musl

  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGETS: >-
        x86_64-unknown-freebsd x86_64-unknown-netbsd x86_64-unknown-illumos x86_64-pc-solaris
        aarch64-unknown-linux-gnu aarch64-linux-android aarch64-apple-ios wasm32-wasip1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain and the cross targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add $TARGETS
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-cross-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Lint the platform layer, the storage engine and the embedded API for each target
        run: |
          for target in $TARGETS; do
            cargo clippy -p eggdb-platform -p eggdb-storage -p eggdb-sql -p eggdb --all-targets --target "$target" -- -D warnings
          done

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-bench-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Benchmarks against the committed baseline
        run: cargo run --release -p eggdb-bench

  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPARE_MANIFEST: crates/eggdb-sqlite-compare/Cargo.toml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/eggdb-sqlite-compare/target
          key: cargo-compare-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'crates/eggdb-sqlite-compare/Cargo.lock') }}
      - name: Format
        run: cargo fmt --manifest-path "$COMPARE_MANIFEST" --check
      - name: Lint
        run: cargo clippy --manifest-path "$COMPARE_MANIFEST" --release --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path "$COMPARE_MANIFEST" --release --locked
      - name: EggDB against SQLite, against the committed baseline
        run: cargo run --manifest-path "$COMPARE_MANIFEST" --release --locked
