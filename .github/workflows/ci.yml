name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Check the shipped crates are only our own
        run: |
          set -o pipefail
          shipped=$(cargo tree -p eggdb -p eggdb-capi -e normal,build --target all --prefix none --format '{p}' \
            | awk '{print $1}' | sort -u)
          if [ -z "$shipped" ]; then
            echo "::error::cargo tree listed no crates for eggdb"
            exit 1
          fi
          foreign=$(echo "$shipped" | grep -v -E '^eggdb(-[a-z]+)?$' || true)
          if [ -n "$foreign" ]; then
            echo "::error::third-party crates in what ships (D1): $foreign"
            exit 1
          fi
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Install psql, mysql and the pg8000 and PyMySQL drivers for the smoke test (test tooling, never shipped)
        run: |
          command -v psql || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          command -v mysql || { sudo apt-get update && sudo apt-get install -y mysql-client; }
          python3 -m venv "$RUNNER_TEMP/pg-driver"
          "$RUNNER_TEMP/pg-driver/bin/pip" install --quiet pg8000==1.31.2 PyMySQL==1.1.1
          echo "EGGDB_SMOKE_PYTHON=$RUNNER_TEMP/pg-driver/bin/python" >> "$GITHUB_ENV"
      - name: Download go-sqlcmd v1.10.0 (MIT) for the smoke test, checked against its SHA-256 (test tooling, never shipped)
        run: |
          mkdir -p "$RUNNER_TEMP/go-sqlcmd"
          cd "$RUNNER_TEMP/go-sqlcmd"
          curl --retry 3 -fsSL -o sqlcmd-linux-amd64.tar.bz2 https://github.com/microsoft/go-sqlcmd/releases/download/v1.10.0/sqlcmd-linux-amd64.tar.bz2
          echo "92516d98c63d99b0994de5b61350c91f6915f9b76f139a59039fbcb225c2e987  sqlcmd-linux-amd64.tar.bz2" | sha256sum -c -
          tar -xjf sqlcmd-linux-amd64.tar.bz2
          tool=$(find "$PWD" -maxdepth 2 -type f -name sqlcmd | head -n 1)
          [ -n "$tool" ] || { echo "::error::no sqlcmd in the go-sqlcmd archive"; exit 1; }
          "$tool" --version
          echo "EGGDB_SMOKE_SQLCMD=$tool" >> "$GITHUB_ENV"
      - name: Smoke test the eggdb command
        run: cargo build -p eggdb && scripts/smoke-test.sh target/debug/eggdb
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Check the C API from C, C++ and Python, and the Python, .NET and Java drivers
        run: cargo build -p eggdb-capi && scripts/c-api/check.sh target/debug "$RUNNER_TEMP/c-api"
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Smoke test the eggdb command
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          cargo build -p eggdb
          scripts/smoke-test.sh "target/debug/eggdb$exe"
      - name: Check the C API from C, C++ and Python (from Python alone on Windows)
        run: |
          cargo build -p eggdb-capi
          if [ "$RUNNER_OS" = Windows ]; then export NO_C_COMPILER=1 PYTHON=python; fi
          scripts/c-api/check.sh target/debug "$(mktemp -d)"

  musl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain and the musl target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-musl-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Test against musl, as the default Linux release is built
        run: cargo test --workspace --target x86_64-unknown-linux-musl

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain and the musl target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-musl-release-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Build the static binary and the image
        run: |
          cargo build --release -p eggdb --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/eggdb deploy/eggdb
          docker build -t eggdb:local deploy
      - uses: helm/kind-action@v1
        with:
          cluster_name: eggdb
      - name: Install the chart and query the database through it
        run: |
          kind load docker-image eggdb:local --name eggdb
          helm lint deploy/helm/eggdb --set password=ci-password
          helm install db deploy/helm/eggdb --set password=ci-password --set image.repository=eggdb --set image.tag=local --wait --timeout 5m
          kubectl rollout status statefulset/db --timeout=3m
          kubectl port-forward service/db 15432:5432 19187:9187 &
          sleep 3
          PGPASSWORD=ci-password psql "host=127.0.0.1 port=15432 user=eggdb dbname=eggdb sslmode=require" \
            -c "CREATE TABLE t (n integer)" -c "INSERT INTO t VALUES (1)" -c "SELECT count(*) FROM t"
          curl -fsS http://127.0.0.1:19187/metrics | grep -q '^eggdb_up 1'
          kubectl delete pod db-0 --wait
          kubectl rollout status statefulset/db --timeout=3m
          kubectl port-forward service/db 15433:5432 &
          sleep 3
          PGPASSWORD=ci-password psql "host=127.0.0.1 port=15433 user=eggdb dbname=eggdb sslmode=require" \
            -tAc "SELECT count(*) FROM t" | grep -qx 1

  resp-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Install redis-cli, redis-py, pymemcache, opensearch-py, pymongo, the neo4j driver, confluent-kafka, pika, paho-mqtt, boto3, nats-py, stomp.py, python-qpid-proton, cassandra-driver and influxdb-client (test tools only, never shipped)
        run: |
          command -v redis-cli || { sudo apt-get update && sudo apt-get install -y redis-tools; }
          python3 -m venv "$RUNNER_TEMP/resp"
          "$RUNNER_TEMP/resp/bin/pip" install --quiet redis==5.0.8 pymemcache==4.0.0 opensearch-py==2.6.0 pymongo==4.8.0 neo4j==5.20.0 confluent-kafka==2.5.0 pika==1.3.2 paho-mqtt==2.1.0 boto3==1.35.0 nats-py==2.9.0 stomp.py==8.1.2 python-qpid-proton==0.39.0 cassandra-driver==3.29.2 influxdb-client==1.45.0
      - name: Serve a database over RESP and talk to it with redis-cli and redis-py
        run: |
          cargo build -p eggdb
          export EGGDB_PASSWORD=ci-resp-password
          target/debug/eggdb serve "$RUNNER_TEMP/resp.eggdb" --create --resp-listen 127.0.0.1:6380 --memcached-listen 127.0.0.1:11212 --es-listen 127.0.0.1:9201 --mongo-listen 127.0.0.1:27018 --bolt-listen 127.0.0.1:7688 --kafka-listen 127.0.0.1:9093 --amqp-listen 127.0.0.1:5673 --mqtt-listen 127.0.0.1:1884 --sqs-listen 127.0.0.1:9325 --nats-listen 127.0.0.1:4223 --stomp-listen 127.0.0.1:61614 --cql-listen 127.0.0.1:9043 --s3-listen 127.0.0.1:9001 --observability-listen 127.0.0.1:8087 &
          for attempt in $(seq 1 50); do redis-cli -p 6380 -a "$EGGDB_PASSWORD" --no-auth-warning PING && break; sleep 0.2; done
          cli() { redis-cli -p 6380 -a "$EGGDB_PASSWORD" --no-auth-warning "$@"; }
          test "$(cli SET greeting hello)" = OK
          test "$(cli GET greeting)" = hello
          test "$(cli INCRBY visits 5)" = 5
          cli HSET user:1 name Ada lang Rust
          test "$(cli HGET user:1 name)" = Ada
          cli RPUSH queue a b c
          test "$(cli LRANGE queue 0 -1 | tr '\n' ' ')" = "a b c "
          cli ZADD board 10 ada 20 grace
          test "$(cli ZRANGE board 0 -1 | tr '\n' ' ')" = "ada grace "
          "$RUNNER_TEMP/resp/bin/python" - <<'PY'
          import redis
          r = redis.Redis(port=6380, password="ci-resp-password", protocol=3)
          assert r.set("k", "v", ex=60)
          assert r.get("k") == b"v"
          assert 0 < r.ttl("k") <= 60
          assert r.hgetall("user:1") == {b"name": b"Ada", b"lang": b"Rust"}
          assert r.smembers("nothing") == set()
          pipe = r.pipeline(transaction=False)
          pipe.incr("n").incr("n").get("n")
          assert pipe.execute() == [1, 2, b"2"]
          print("redis-py over RESP3: passed")
          PY
          "$RUNNER_TEMP/resp/bin/python" - <<'PY'
          from pymemcache.client.base import Client
          client = Client(("127.0.0.1", 11212))
          assert client.set("greeting", b"hello", expire=60)
          assert client.get("greeting") == b"hello"
          assert client.add("greeting", b"x") is False
          client.set("count", b"41")
          assert client.incr("count", 1) == 42
          value, token = client.gets("greeting")
          assert client.cas("greeting", b"bye", token)
          assert client.get_many(["greeting", "missing"]) == {"greeting": b"bye"}
          assert client.delete("greeting")
          print("pymemcache: passed")
          PY
          "$RUNNER_TEMP/resp/bin/python" - <<'PY'
          from opensearchpy import OpenSearch, helpers
          client = OpenSearch(hosts=[{"host": "127.0.0.1", "port": 9201}], http_auth=("eggdb", "ci-resp-password"), use_ssl=False)
          assert client.info()["version"]["number"]
          client.indices.create(index="books", body={"mappings": {"properties": {"title": {"type": "text"}}}})
          assert client.indices.exists(index="books")
          client.index(index="books", id="1", body={"title": "The quick brown fox", "genre": "fable", "pages": 120})
          helpers.bulk(client, [
              {"_index": "books", "_id": "2", "_source": {"title": "Foxes running quickly", "genre": "nature", "pages": 300}},
              {"_index": "books", "_id": "3", "_source": {"title": "A slow turtle", "genre": "fable", "pages": 80}},
          ])
          assert client.get(index="books", id="1")["_source"]["pages"] == 120
          found = client.search(index="books", body={"query": {"match": {"title": "fox"}}})
          assert [hit["_id"] for hit in found["hits"]["hits"]] == ["1", "2"], found
          totals = client.search(index="books", body={"size": 0, "aggs": {"genres": {"terms": {"field": "genre"}}}})
          assert totals["aggregations"]["genres"]["buckets"][0] == {"key": "fable", "doc_count": 2}, totals
          assert client.count(index="books")["count"] == 3
          client.delete(index="books", id="3")
          client.indices.delete(index="books")
          assert not client.indices.exists(index="books")
          print("opensearch-py: passed")
          PY
          "$RUNNER_TEMP/resp/bin/python" - <<'PY'
          from pymongo import MongoClient, ASCENDING, DESCENDING
          client = MongoClient("mongodb://eggdb:ci-resp-password@127.0.0.1:27018/?authSource=admin&directConnection=true")
          db = client.app
          assert client.admin.command("ping")["ok"] == 1.0
          people = db.people
          result = people.insert_many([{"name": "Ada", "age": 36, "tags": ["math"]}, {"name": "Grace", "age": 45, "tags": ["navy", "code"]}, {"name": "Linus", "age": 28}])
          assert len(result.inserted_ids) == 3
          assert people.find_one({"name": "Ada"})["age"] == 36
          assert [p["name"] for p in people.find({"age": {"$gte": 30}}).sort("age", DESCENDING)] == ["Grace", "Ada"]
          assert people.count_documents({"tags": "code"}) == 1
          assert people.update_one({"name": "Linus"}, {"$inc": {"age": 1}, "$push": {"tags": "kernel"}}).modified_count == 1
          assert people.find_one({"name": "Linus"}, {"_id": 0, "age": 1}) == {"age": 29}
          totals = list(people.aggregate([{"$group": {"_id": None, "total": {"$sum": "$age"}}}]))
          assert totals[0]["total"] == 110, totals
          people.create_index([("name", ASCENDING)])
          assert "name_1" in people.index_information()
          assert people.delete_many({"age": {"$lt": 40}}).deleted_count == 2
          assert sorted(db.list_collection_names()) == ["people"]
          db.drop_collection("people")
          print("pymongo: passed")
          PY
          "$RUNNER_TEMP/resp/bin/python" - <<'PY'
          from neo4j import GraphDatabase
          driver = GraphDatabase.driver("bolt://127.0.0.1:7688", auth=("eggdb", "ci-resp-password"))
          with driver.session() as session:
              session.run("CREATE (a:Person {name: 'Ada'})-[:KNOWS]->(g:Person {name: 'Grace'})").consume()
              names = [record["name"] for record in session.run("MATCH (:Person {name: $name})-[:KNOWS]->(p) RETURN p.name AS name", name="Ada")]
              assert names == ["Grace"], names
              node = session.run("MATCH (p:Person {name: 'Ada'}) RETURN p").single()["p"]
              assert "Person" in node.labels and node["name"] == "Ada"
              assert session.run("MATCH (p:Person) RETURN count(p) AS people").single()["people"] == 2
          driver.close()
          print("neo4j driver over Bolt: passed")
          PY
          "$RUNNER_TEMP/resp/bin/python" - <<'PY'
          from confluent_kafka import Consumer, Producer, TopicPartition, OFFSET_BEGINNING
          producer = Producer({"bootstrap.servers": "127.0.0.1:9093", "api.version.request": True})
          for n in range(5):
              producer.produce("events", value=f"event {n}".encode())
          assert producer.flush(10) == 0
          consumer = Consumer({"bootstrap.servers": "127.0.0.1:9093", "group.id": "ci", "enable.auto.commit": False})
          consumer.assign([TopicPartition("events", 0, OFFSET_BEGINNING)])
          values = []
          while len(values) < 5:
              message = consumer.poll(10)
              assert message is not None, values
              assert message.error() is None, message.error()
              values.append(message.value().decode())
          assert values == [f"event {n}" for n in range(5)], values
          consumer.close()
          print("confluent-kafka: passed")
          PY
          "$RUNNER_TEMP/resp/bin/python" - <<'PY'
          import pika
          parameters = pika.ConnectionParameters("127.0.0.1", 5673, credentials=pika.PlainCredentials("eggdb", "ci-resp-password"))
          connection = pika.BlockingConnection(parameters)
          channel = connection.channel()
          channel.confirm_delivery()
          channel.queue_declare(queue="jobs")
          for n in range(3):
              channel.basic_publish(exchange="", routing_key="jobs", body=f"job {n}".encode())
          received = []
          for method, properties, body in channel.consume("jobs", inactivity_timeout=2):
              if method is None:
                  break
              received.append(body.decode())
              channel.basic_ack(method.delivery_tag)
              if len(received) == 3:
                  break
          assert received == ["job 0", "job 1", "job 2"], received
          channel.cancel()
          connection.close()
          print("pika over AMQP 0-9-1: passed")
          PY
          "$RUNNER_TEMP/resp/bin/python" - <<'PY'
          import paho.mqtt.publish as publish
          import paho.mqtt.subscribe as subscribe
          auth = {"username": "eggdb", "password": "ci-resp-password"}
          publish.single("home/kitchen/temp", "21.5", qos=1, retain=True, hostname="127.0.0.1", port=1884, auth=auth)
          message = subscribe.simple("home/+/temp", qos=1, hostname="127.0.0.1", port=1884, auth=auth)
          assert message.payload == b"21.5" and message.retain, message.payload
          print("paho-mqtt: passed")
          PY
          "$RUNNER_TEMP/resp/bin/python" - <<'PY'
          import boto3
          sqs = boto3.client("sqs", endpoint_url="http://127.0.0.1:9325", region_name="us-east-1", aws_access_key_id="eggdb", aws_secret_access_key="ci-resp-password")
          url = sqs.create_queue(QueueName="orders")["QueueUrl"]
          sqs.send_message(QueueUrl=url, MessageBody="order 1")
          messages = sqs.receive_message(QueueUrl=url, MaxNumberOfMessages=10).get("Messages", [])
          assert [m["Body"] for m in messages] == ["order 1"], messages
          sqs.delete_message(QueueUrl=url, ReceiptHandle=messages[0]["ReceiptHandle"])
          assert url in sqs.list_queues()["QueueUrls"]
          print("boto3 over the SQS JSON protocol: passed")
          PY
          "$RUNNER_TEMP/resp/bin/python" - <<'PY'
          import boto3
          import urllib.request
          s3 = boto3.client("s3", endpoint_url="http://127.0.0.1:9001", region_name="us-east-1", aws_access_key_id="eggdb", aws_secret_access_key="ci-resp-password")
          s3.create_bucket(Bucket="eggs")
          s3.put_object(Bucket="eggs", Key="2026/first egg.txt", Body=b"hello object", ContentType="text/plain", Metadata={"farm": "eggspot"})
          got = s3.get_object(Bucket="eggs", Key="2026/first egg.txt")
          assert got["Body"].read() == b"hello object" and got["Metadata"] == {"farm": "eggspot"}, got
          assert s3.get_object(Bucket="eggs", Key="2026/first egg.txt", Range="bytes=6-")["Body"].read() == b"object"
          listed = s3.list_objects_v2(Bucket="eggs", Delimiter="/")
          assert [p["Prefix"] for p in listed["CommonPrefixes"]] == ["2026/"], listed
          upload = s3.create_multipart_upload(Bucket="eggs", Key="big")["UploadId"]
          parts = [{"PartNumber": n, "ETag": s3.upload_part(Bucket="eggs", Key="big", UploadId=upload, PartNumber=n, Body=body)["ETag"]} for n, body in [(1, b"a" * (5 << 20)), (2, b"tail")]]
          s3.complete_multipart_upload(Bucket="eggs", Key="big", UploadId=upload, MultipartUpload={"Parts": parts})
          assert s3.head_object(Bucket="eggs", Key="big")["ContentLength"] == (5 << 20) + 4
          url = s3.generate_presigned_url("get_object", Params={"Bucket": "eggs", "Key": "2026/first egg.txt"}, ExpiresIn=60)
          assert urllib.request.urlopen(url).read() == b"hello object"
          print("boto3 over S3: passed")
          PY
          "$RUNNER_TEMP/resp/bin/python" - <<'PY'
          import asyncio
          import nats
          async def main():
              nc = await nats.connect("nats://127.0.0.1:4223", user="eggdb", password="ci-resp-password")
              sub = await nc.subscribe("greet.*")
              await nc.publish("greet.ada", b"hello")
              message = await sub.next_msg(timeout=2)
              assert message.data == b"hello"
              async def answer(request):
                  await request.respond(b"pong")
              await nc.subscribe("service.ping", cb=answer)
              response = await nc.request("service.ping", b"ping", timeout=2)
              assert response.data == b"pong"
              await nc.close()
          asyncio.run(main())
          print("nats-py: passed")
          PY
          "$RUNNER_TEMP/resp/bin/python" - <<'PY'
          import time
          import stomp
          received = []
          class Listener(stomp.ConnectionListener):
              def on_message(self, frame):
                  received.append(frame.body)
          conn = stomp.Connection([("127.0.0.1", 61614)], heartbeats=(0, 0))
          conn.set_listener("", Listener())
          conn.connect("eggdb", "ci-resp-password", wait=True)
          conn.subscribe("/queue/stomp-jobs", id="1", ack="auto")
          conn.send("/queue/stomp-jobs", "job 1")
          for attempt in range(50):
              if received:
                  break
              time.sleep(0.1)
          assert received == ["job 1"], received
          conn.disconnect()
          print("stomp.py: passed")
          PY
          "$RUNNER_TEMP/resp/bin/python" - <<'PY'
          from proton import Message
          from proton.utils import BlockingConnection
          conn = BlockingConnection("amqp://127.0.0.1:5673", user="eggdb", password="ci-resp-password", allowed_mechs="PLAIN")
          sender = conn.create_sender("amqp1-orders")
          sender.send(Message(body="order 1.0"))
          receiver = conn.create_receiver("amqp1-orders", credit=10)
          message = receiver.receive(timeout=5)
          receiver.accept()
          assert bytes(message.body) == b"order 1.0", message.body
          conn.close()
          print("python-qpid-proton over AMQP 1.0: passed")
          PY
          "$RUNNER_TEMP/resp/bin/python" - <<'PY'
          from cassandra.auth import PlainTextAuthProvider
          from cassandra.cluster import Cluster
          from cassandra.io.asyncioreactor import AsyncioConnection
          cluster = Cluster(["127.0.0.1"], port=9043, protocol_version=4, auth_provider=PlainTextAuthProvider("eggdb", "ci-resp-password"), connection_class=AsyncioConnection)
          session = cluster.connect()
          session.execute("CREATE KEYSPACE IF NOT EXISTS shop WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1}")
          session.set_keyspace("shop")
          session.execute("CREATE TABLE IF NOT EXISTS events (device text, at int, reading double, PRIMARY KEY (device, at))")
          insert = session.prepare("INSERT INTO events (device, at, reading) VALUES (?, ?, ?)")
          for at in range(3):
              session.execute(insert, ("sensor-1", at, at * 1.5))
          rows = list(session.execute("SELECT at, reading FROM events WHERE device = %s", ("sensor-1",)))
          assert [(row.at, row.reading) for row in rows] == [(0, 0.0), (1, 1.5), (2, 3.0)], rows
          cluster.shutdown()
          print("cassandra-driver over CQL v4: passed")
          PY
          "$RUNNER_TEMP/resp/bin/python" - <<'PY'
          import base64
          import json
          import urllib.request
          from influxdb_client import InfluxDBClient, Point
          from influxdb_client.client.write_api import SYNCHRONOUS
          client = InfluxDBClient(url="http://127.0.0.1:8087", token="ci-resp-password", org="eggs")
          client.write_api(write_options=SYNCHRONOUS).write(bucket="metrics", record=[Point("temperature").tag("room", "kitchen").field("value", 21.5), Point("temperature").tag("room", "hall").field("value", 19.0)])
          client.close()
          authorization = "Basic " + base64.b64encode(b"eggdb:ci-resp-password").decode()
          request = urllib.request.Request("http://127.0.0.1:8087/api/v1/query?query=sum%28temperature%29", headers={"Authorization": authorization})
          answer = json.load(urllib.request.urlopen(request))
          assert answer["data"]["result"][0]["value"][1] == "40.5", answer
          print("influxdb-client and PromQL: passed")
          PY

