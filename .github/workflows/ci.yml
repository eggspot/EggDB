        if: runner.os != 'Windows'
        run: scripts/install/check.sh >> "$GITHUB_STEP_SUMMARY"
      - name: Install the latest release with the PowerShell installer and time it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'eggdb-bin'
          $env:EGGDB_INSTALL_DIR = $dir
          $installing = [System.Diagnostics.Stopwatch]::StartNew()
          ./scripts/install/install.ps1
          $installing.Stop()
          $starting = [System.Diagnostics.Stopwatch]::StartNew()
          & (Join-Path $dir 'eggdb.exe') version
          $starting.Stop()
