name: Tag release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: tag-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      published: ${{ steps.published.outputs.published }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Check the commit is on main
        run: git merge-base --is-ancestor "$SHA" origin/main
      - name: Read the Release trailer and check the version and the notes
        id: check
        run: scripts/release/tag-from-trailer.sh "$SHA" >> "$GITHUB_OUTPUT"
      - name: Create and push the annotated tag
        if: steps.check.outputs.tag != '' && steps.check.outputs.tagged != 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" "$SHA" -m "EggDB $TAG"
          git push origin "refs/tags/$TAG"
      - name: Check whether the release is already published
        id: published
        if: steps.check.outputs.tag != ''
        env:
          TAG: ${{ steps.check.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$draft" = "false" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: tag
    if: needs.tag.outputs.tag != '' && needs.tag.outputs.published != 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
