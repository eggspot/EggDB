name: Release

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/release.yml', 'docs/releases/**', 'scripts/smoke-test.sh', 'crates/eggdb/tests/data/**']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag to publish again (vMAJOR.MINOR.PATCH); empty for a dry run of main
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and publish (vMAJOR.MINOR.PATCH)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            runs_here: true
            smoke_require: psql pg8000 mysql pymysql sqlcmd ui-terminal
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            runs_here: true
            smoke_require: psql pg8000 mysql pymysql sqlcmd ui-terminal
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            runs_here: true
            smoke_require: psql pg8000 mysql pymysql sqlcmd ui-terminal
            capi: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            runs_here: true
            smoke_require: psql pg8000 mysql pymysql sqlcmd ui-terminal
            capi: true
          - target: aarch64-apple-darwin
            os: macos-latest
            runs_here: true
            smoke_require: psql pg8000 mysql pymysql ui-terminal
            capi: true
          - target: x86_64-apple-darwin
            os: macos-latest
            runs_here: false
            capi: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            runs_here: true
            capi: true
            exe: .exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            runs_here: false
            capi: true
            exe: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      EXE: ${{ matrix.exe }}
    steps:
      - name: Check the release tag's form
        if: env.TAG != ''
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::release tag $TAG is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1
      - name: Install the pinned toolchain and the target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - name: Read the version
        run: |
          version="v$(cargo pkgid -p eggdb | sed 's/.*[#@]//')"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PACKAGE=eggdb-$version-$TARGET" >> "$GITHUB_ENV"
      - name: Check the tag names the version being built
        if: env.TAG != ''
        run: |
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG does not match the workspace version $VERSION"
            exit 1
          fi
      - name: Check the shipped binary depends only on our own crates
        run: |
          foreign=$(cargo tree -p eggdb -p eggdb-capi -e normal,build --prefix none --target "$TARGET" \
            | grep -v -E ' \((/|[A-Za-z]:)' || true)
          if [ -n "$foreign" ]; then
            echo "::error::third-party crates in the shipped binary (D1): $foreign"
            exit 1
          fi
      - name: Build
        run: cargo build --release --locked -p eggdb --target "$TARGET"
      - name: Package
        run: |
          mkdir -p "dist/$PACKAGE"
          cp "target/$TARGET/release/eggdb$EXE" LICENSE-MIT LICENSE-APACHE README.md "dist/$PACKAGE/"
          cd dist
          if [ -n "$EXE" ]; then
            archive="$PACKAGE.zip"
            7z a -tzip -mx=9 "$archive" "$PACKAGE" > /dev/null
          else
            archive="$PACKAGE.tar.gz"
            tar -czf "$archive" "$PACKAGE"
          fi
          binary_bytes=$(wc -c < "$PACKAGE/eggdb$EXE" | tr -d ' ')
          archive_bytes=$(wc -c < "$archive" | tr -d ' ')
          printf '| %s | %s | %s |\n' "\`$TARGET\`" "$binary_bytes" "$archive_bytes" > "$PACKAGE.size"
          rm -r "$PACKAGE"
      - uses: actions/setup-python@v6
        if: matrix.runs_here && !matrix.exe
        with:
          python-version: "3.12"
      - name: Install psql, mysql, the pg8000 and PyMySQL drivers and, on Linux, go-sqlcmd v1.10.0 (MIT) for the smoke test (test tooling, never shipped)
        if: matrix.runs_here && !matrix.exe
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            command -v psql || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
            command -v mysql || { sudo apt-get update && sudo apt-get install -y mysql-client; }
            case "$(uname -m)" in
              x86_64) sqlcmd_arch=amd64 sqlcmd_sha256=92516d98c63d99b0994de5b61350c91f6915f9b76f139a59039fbcb225c2e987 ;;
              aarch64) sqlcmd_arch=arm64 sqlcmd_sha256=9faaa981f9c374f319ac796dedb4678499b8596c87d5b6c512e9b0e7a3b74f8e ;;
              *) echo "::error::no go-sqlcmd download for $(uname -m)"; exit 1 ;;
            esac
            mkdir -p "$RUNNER_TEMP/go-sqlcmd"
            cd "$RUNNER_TEMP/go-sqlcmd"
            curl --retry 3 -fsSL -o sqlcmd.tar.bz2 "https://github.com/microsoft/go-sqlcmd/releases/download/v1.10.0/sqlcmd-linux-$sqlcmd_arch.tar.bz2"
            echo "$sqlcmd_sha256  sqlcmd.tar.bz2" | sha256sum -c -
            tar -xjf sqlcmd.tar.bz2
            tool=$(find "$PWD" -maxdepth 2 -type f -name sqlcmd | head -n 1)
            [ -n "$tool" ] || { echo "::error::no sqlcmd in the go-sqlcmd archive"; exit 1; }
            "$tool" --version
            echo "EGGDB_SMOKE_SQLCMD=$tool" >> "$GITHUB_ENV"
          else
            brew install libpq mysql-client
            echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"
            echo "$(brew --prefix mysql-client)/bin" >> "$GITHUB_PATH"
          fi
          python3 -m venv "$RUNNER_TEMP/drivers"
          "$RUNNER_TEMP/drivers/bin/pip" install --quiet pg8000==1.31.2 PyMySQL==1.1.1
          echo "EGGDB_SMOKE_PYTHON=$RUNNER_TEMP/drivers/bin/python" >> "$GITHUB_ENV"
      - name: Unpack the archive as a user would, check its files and version, and smoke test the binary in it
        if: matrix.runs_here
        env:
          EGGDB_SMOKE_REQUIRE: ${{ matrix.smoke_require }}
        run: |
          mkdir unpacked
          cd unpacked
          if [ -n "$EXE" ]; then
            7z x -y "../dist/$PACKAGE.zip" > /dev/null
          else
            tar -xzf "../dist/$PACKAGE.tar.gz"
          fi
          cd ..
          for file in "eggdb$EXE" LICENSE-MIT LICENSE-APACHE README.md; do
            [ -f "unpacked/$PACKAGE/$file" ] || { echo "::error::$file is missing from the $PACKAGE archive"; exit 1; }
          done
          binary="$PWD/unpacked/$PACKAGE/eggdb$EXE"
          output=$("$binary" --version)
          echo "$output"
          [ "$output" = "eggdb ${VERSION#v}" ] || { echo "::error::the archive's binary printed '$output', not eggdb ${VERSION#v}"; exit 1; }
          scripts/smoke-test.sh "$binary"
      - name: Build the C API library
        if: matrix.capi
        run: cargo build --release --locked -p eggdb-capi --target "$TARGET"
      - name: Check the built C API from C, C++ and Python
        if: matrix.capi && matrix.runs_here && !matrix.exe
        run: scripts/c-api/check.sh "target/$TARGET/release" "$RUNNER_TEMP/c-api"
      - name: Package the C API
        if: matrix.capi
        run: |
          capi="eggdb-capi-$VERSION-$TARGET"
          release="target/$TARGET/release"
          mkdir -p "dist/$capi/include" "dist/$capi/lib"
          cp crates/eggdb-capi/include/eggdb.h "dist/$capi/include/"
          for library in libeggdb_capi.so libeggdb_capi.dylib libeggdb_capi.a eggdb_capi.dll eggdb_capi.dll.lib eggdb_capi.lib; do
            if [ -f "$release/$library" ]; then cp "$release/$library" "dist/$capi/lib/"; fi
          done
          cp examples/python/eggdb_ctypes.py docs/c-api.md LICENSE-MIT LICENSE-APACHE "dist/$capi/"
          cd dist
          if [ -n "$EXE" ]; then
            7z a -tzip -mx=9 "$capi.zip" "$capi" > /dev/null
          else
            tar -czf "$capi.tar.gz" "$capi"
          fi
          rm -r "$capi"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: dist/
          retention-days: 3
          if-no-files-found: error

  xcframework:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build the C API as an XCFramework and zip it for Swift packages
        run: |
          name="eggdb-${TAG:-main}-apple.xcframework.zip"
          scripts/apple/xcframework.sh "$RUNNER_TEMP/xcframework/CEggDB.xcframework"
          mkdir -p dist
          (cd "$RUNNER_TEMP/xcframework" && ditto -c -k --sequesterRsrc --keepParent CEggDB.xcframework "$GITHUB_WORKSPACE/dist/$name")
          printf '| Apple XCFramework | - | %s |\n' "$(wc -c < "dist/$name" | tr -d ' ')" > "dist/$name.size"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: eggdb-xcframework
          path: dist/*
          retention-days: 7

  publish:
    needs: [build, xcframework]
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      latest: ${{ steps.state.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1
      - name: Read the release's state and whether it is the newest version
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          echo "release=$draft" >> "$GITHUB_OUTPUT"
          newest=$(git ls-remote --tags origin 'refs/tags/v*' | sed -n 's|.*refs/tags/\(v[0-9][0-9.]*\)$|\1|p' | sort -V | tail -n 1)
          if [ "$newest" = "$TAG" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.state.outputs.release != 'false'
        with:
          pattern: eggdb-*
          path: dist
          merge-multiple: true
      - name: Write the checksums and the release notes
        if: steps.state.outputs.release != 'false'
        run: |
          cd dist
          sha256sum eggdb-*.tar.gz eggdb-*.zip > SHA256SUMS
          {
            cat "../docs/releases/$TAG.md"
            echo
            echo '## Sizes'
            echo
            echo '| Target | Binary (bytes) | Download (bytes) |'
            echo '|--------|----------------|------------------|'
            sort ./*.size
            cat <<'PROVENANCE'

          Each archive is checked by `SHA256SUMS` and carries a signed build provenance
          attestation: `gh attestation verify <archive> -R eggspot/EggDB`.
          PROVENANCE
          } > ../release-notes.md
          rm ./*.size
      - uses: actions/attest-build-provenance@v4.2.2
        if: steps.state.outputs.release != 'false'
        with:
          subject-path: dist/*
      - name: Publish the GitHub Release
        if: steps.state.outputs.release != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.state.outputs.release }}
          LATEST: ${{ steps.state.outputs.latest }}
        run: |
          if [ "$RELEASE" = "true" ]; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/* --draft \
              --verify-tag --title "EggDB $TAG" --notes-file release-notes.md
          fi
          gh release edit "$TAG" --draft=false --latest="$LATEST"

  swift-package:
    needs: publish
    if: needs.publish.outputs.latest == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1
      - uses: actions/download-artifact@v8
        with:
          name: eggdb-xcframework
          path: dist
      - name: Point the swift-package branch at this release's XCFramework
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="dist/eggdb-$TAG-apple.xcframework.zip"
          package="$RUNNER_TEMP/swift-package"
          if git fetch --depth 1 origin swift-package; then
            git worktree add --detach "$package" FETCH_HEAD
          else
            git worktree add --detach "$package"
            git -C "$package" checkout --orphan swift-package
            git -C "$package" rm -rq .
          fi
          scripts/apple/swift-package.sh "$TAG" "$zip" "$package"
          cd "$package"
          git add Package.swift Sources README.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Swift package for EggDB $TAG"
          git push origin HEAD:refs/heads/swift-package

  image:
    needs: publish
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1
      - uses: actions/download-artifact@v8
        with:
          pattern: eggdb-*-unknown-linux-musl
          path: dist
          merge-multiple: true
      - name: Unpack the static binaries, one per architecture
        run: |
          for pair in x86_64:amd64 aarch64:arm64; do
            target="${pair%%:*}-unknown-linux-musl"
            platform="${pair##*:}"
            tar -xzf "dist/eggdb-$TAG-$target.tar.gz" -C "$RUNNER_TEMP"
            mkdir -p "deploy/linux/$platform"
            cp "$RUNNER_TEMP/eggdb-$TAG-$target/eggdb" "deploy/linux/$platform/eggdb"
          done
      - name: Build, push and smoke test the image on the GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.publish.outputs.latest }}
        run: |
          version="${TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          for platform in amd64 arm64; do
            docker buildx build deploy --platform "linux/$platform" --build-arg "EGGDB_BINARY=linux/$platform/eggdb" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.version=$version" \
              --label "org.opencontainers.image.licenses=MIT OR Apache-2.0" \
              -t "$image:$version-$platform" --push
          done
          if [ "$LATEST" = "true" ]; then
            docker buildx imagetools create -t "$image:$version" -t "$image:latest" "$image:$version-amd64" "$image:$version-arm64"
          else
            docker buildx imagetools create -t "$image:$version" "$image:$version-amd64" "$image:$version-arm64"
          fi
          docker run --rm "$image:$version" --version | grep -F "$version"

