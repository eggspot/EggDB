[package]
name = "eggdb-adbc"
autotests = false
description = "EggDB's ADBC driver: the embedded database through the Arrow Database Connectivity C API, with results as Arrow C data interface streams."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "eggdb_adbc"
