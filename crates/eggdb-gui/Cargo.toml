[package]
name = "eggdb-gui"
autotests = false
description = "EggDB's own GUI toolkit and desktop client: a software rasterizer, TrueType text from the system's fonts, and the client's screens as designed in docs/ux/gui.md."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
eggdb = { path = "../eggdb" }
eggdb-pgwire = { path = "../eggdb-pgwire" }
eggdb-platform = { path = "../eggdb-platform" }

[[test]]
name = "all"
path = "tests/all/main.rs"
