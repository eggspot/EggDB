[package]
name = "eggdb-tpcc-compare"
description = "EggDB measured against PostgreSQL and MySQL on the same machine with a TPC-C-shaped schema and its five transactions over each database's own protocol (D7, D1140). Never published and never shipped."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eggspot/EggDB"
publish = false

[workspace]

[dependencies]
eggdb-pgwire = { path = "../eggdb-pgwire" }
eggdb-mysqlwire = { path = "../eggdb-mysqlwire" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
