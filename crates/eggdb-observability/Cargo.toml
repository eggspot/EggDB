[package]
name = "eggdb-observability"
description = "EggDB's metrics and logs store: InfluxDB line protocol and Prometheus remote write into SQL tables, PromQL through the Prometheus HTTP API, and syslog over UDP and TCP into the syslog table."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
eggdb-columnar = { path = "../eggdb-columnar" }
