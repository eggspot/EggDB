[package]
name = "eggdb"
autotests = false
description = "EggDB: one database for every kind of data, written from scratch in Rust."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
exclude = ["tests/data/oracle/hr"]

[lints]
workspace = true

[[bin]]
name = "eggdb"
path = "src/main.rs"

[features]
egg-allocator = []

[dependencies]
eggdb-amqp = { path = "../eggdb-amqp" }
