[package]
name = "eggdb"
description = "EggDB: one database for every kind of data, written from scratch in Rust."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
exclude = ["tests/data/oracle/hr"]

[lints]
workspace = true

[[bin]]
name = "eggdb"
path = "src/main.rs"

[features]
egg-allocator = []

[dependencies]
eggdb-commands = { path = "../eggdb-commands" }
eggdb-mcp = { path = "../eggdb-mcp" }
eggdb-mysqlwire = { path = "../eggdb-mysqlwire" }
eggdb-pgwire = { path = "../eggdb-pgwire" }
eggdb-platform = { path = "../eggdb-platform" }
eggdb-sql = { path = "../eggdb-sql" }
eggdb-sqlite-format = { path = "../eggdb-sqlite-format" }
eggdb-storage = { path = "../eggdb-storage" }
eggdb-tdswire = { path = "../eggdb-tdswire" }
eggdb-tls = { path = "../eggdb-tls" }
eggdb-ui = { path = "../eggdb-ui" }
