[package]
name = "eggdb-tls"
autotests = false
description = "EggDB's own TLS 1.3 and 1.2, server and client, written from the RFCs on eggdb-crypto: DER, PEM, X.509 certificates and private keys, certificate verification, the handshake and the record layer (D23, D35)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
eggdb-crypto = { path = "../eggdb-crypto" }
eggdb-platform = { path = "../eggdb-platform" }

[[test]]
name = "all"
path = "tests/all/main.rs"
