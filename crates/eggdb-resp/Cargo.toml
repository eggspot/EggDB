[package]
name = "eggdb-resp"
description = "EggDB's server for the RESP protocol (RESP2 and RESP3, from the public protocol specification) with strings, hashes, lists, sets, sorted sets, bitmaps, HyperLogLog and geo indexes stored in EggDB, so Redis-compatible clients connect unchanged."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
eggdb-crypto = { path = "../eggdb-crypto" }
eggdb-keyspace = { path = "../eggdb-keyspace" }
eggdb-lua = { path = "../eggdb-lua" }
eggdb-platform = { path = "../eggdb-platform" }
