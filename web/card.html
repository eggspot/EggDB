<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EggDB</title>
<style>html, body { margin: 0; height: 100%; } #card { width: 100vw; height: 100vh; }</style>
</head>
<body>
<main id="card"></main>
<script type="module">
import { ConnectCard } from "./card.js";
const params = new URLSearchParams(location.search);
const fonts = { ui: params.get("font"), bold: params.get("bold-font") ?? params.get("font") };
await ConnectCard.mount(document.getElementById("card"), {
  wasm: "eggdb-gui.wasm",
  theme: params.get("theme") ?? (matchMedia("(prefers-contrast: more)").matches ? "high-contrast" : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"),
  fonts,
  autofocus: true,
});
</script>
</body>
</html>
