group 'app.eggspot.eggdb_flutter'
version '0.1.0'

apply plugin: 'com.android.library'

android {
    namespace 'app.eggspot.eggdb_flutter'
    compileSdk 34
    defaultConfig {
        minSdk 21
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}
