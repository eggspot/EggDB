name: eggdb_flutter
description: EggDB embedded in Flutter apps on Android, iOS and macOS, with EggDB's library bundled.
version: 0.1.0
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"
dependencies:
  flutter:
    sdk: flutter
  eggdb:
    path: ..
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
