[workspace]
resolver = "3"
members = ["crates/eggdb", "crates/eggdb-bench", "crates/eggdb-bolt", "crates/eggdb-ai", "crates/eggdb-amqp", "crates/eggdb-auth", "crates/eggdb-bson", "crates/eggdb-capi", "crates/eggdb-cluster", "crates/eggdb-columnar", "crates/eggdb-commands", "crates/eggdb-consensus", "crates/eggdb-crypto", "crates/eggdb-documents", "crates/eggdb-esrest", "crates/eggdb-geo", "crates/eggdb-graph", "crates/eggdb-keyspace", "crates/eggdb-gui", "crates/eggdb-http", "crates/eggdb-kafka", "crates/eggdb-memcached", "crates/eggdb-mcp", "crates/eggdb-mongowire", "crates/eggdb-mqtt", "crates/eggdb-nats", "crates/eggdb-parquet", "crates/eggdb-mysqlwire", "crates/eggdb-pgwire", "crates/eggdb-queues", "crates/eggdb-replication", "crates/eggdb-platform", "crates/eggdb-resp", "crates/eggdb-search", "crates/eggdb-sql", "crates/eggdb-sqs", "crates/eggdb-sqlite-format", "crates/eggdb-sqlite3", "crates/eggdb-storage", "crates/eggdb-tdswire", "crates/eggdb-tls", "crates/eggdb-ui", "crates/eggdb-vector"]
exclude = ["crates/eggdb-redis-compare", "crates/eggdb-sqlite-compare"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eggspot/EggDB"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
