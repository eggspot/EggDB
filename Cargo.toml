[workspace]
resolver = "3"
members = ["crates/eggdb", "crates/eggdb-bench", "crates/eggdb-crypto", "crates/eggdb-mcp", "crates/eggdb-mysqlwire", "crates/eggdb-pgwire", "crates/eggdb-platform", "crates/eggdb-sql", "crates/eggdb-storage", "crates/eggdb-tdswire", "crates/eggdb-ui"]
exclude = ["crates/eggdb-sqlite-compare"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eggspot/EggDB"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
