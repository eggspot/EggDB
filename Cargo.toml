[workspace]
resolver = "3"
members = ["crates/eggdb", "crates/eggdb-adbc", "crates/eggdb-bench", "crates/eggdb-bolt", "crates/eggdb-ai", "crates/eggdb-amqp", "crates/eggdb-api", "crates/eggdb-arrow", "crates/eggdb-auth", "crates/eggdb-bson", "crates/eggdb-capi", "crates/eggdb-clickhouse", "crates/eggdb-cluster", "crates/eggdb-cluster-bench", "crates/eggdb-columnar", "crates/eggdb-content", "crates/eggdb-commands", "crates/eggdb-connect", "crates/eggdb-consensus", "crates/eggdb-cql", "crates/eggdb-dav", "crates/eggdb-crypto", "crates/eggdb-documents", "crates/eggdb-dynamodb", "crates/eggdb-esrest", "crates/eggdb-etcd", "crates/eggdb-flight", "crates/eggdb-format", "crates/eggdb-fuzz", "crates/eggdb-geo", "crates/eggdb-graph", "crates/eggdb-gremlin", "crates/eggdb-keyspace", "crates/eggdb-kql", "crates/eggdb-lua", "crates/eggdb-mail", "crates/eggdb-gui", "crates/eggdb-http", "crates/eggdb-http2", "crates/eggdb-jepsen", "crates/eggdb-kafka", "crates/eggdb-memcached", "crates/eggdb-mcp", "crates/eggdb-mongowire", "crates/eggdb-mqtt", "crates/eggdb-nats", "crates/eggdb-observability", "crates/eggdb-odbc", "crates/eggdb-operator", "crates/eggdb-parquet", "crates/eggdb-mysqlwire", "crates/eggdb-pgwire", "crates/eggdb-queues", "crates/eggdb-rdf", "crates/eggdb-replication", "crates/eggdb-platform", "crates/eggdb-resp", "crates/eggdb-s3", "crates/eggdb-search", "crates/eggdb-sql", "crates/eggdb-sparql-suite", "crates/eggdb-sqs", "crates/eggdb-stomp", "crates/eggdb-sqlite-format", "crates/eggdb-sqlite3", "crates/eggdb-sqllogictest", "crates/eggdb-storage", "crates/eggdb-sync", "crates/eggdb-tdswire", "crates/eggdb-text", "crates/eggdb-tls", "crates/eggdb-trino", "crates/eggdb-ui", "crates/eggdb-vector", "crates/eggdb-wasm", "crates/eggdb-wasm-vm", "crates/eggdb-zookeeper"]
exclude = ["crates/eggdb-broker-compare", "crates/eggdb-cql-compare", "crates/eggdb-ldbc-compare", "crates/eggdb-mongo-compare", "crates/eggdb-opensearch-compare", "crates/eggdb-redis-compare", "crates/eggdb-sqlite-compare", "crates/eggdb-tsdb-compare"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eggspot/EggDB"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
