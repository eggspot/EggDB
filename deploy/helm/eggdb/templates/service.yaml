apiVersion: v1
kind: Service
metadata:
  name: {{ include "eggdb.name" . }}
  labels:
    app.kubernetes.io/name: eggdb
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: eggdb
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgresql
      port: {{ .Values.service.postgresqlPort }}
      targetPort: postgresql
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
