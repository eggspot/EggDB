apiVersion: v1
kind: ServiceAccount
metadata:
  name: eggdb-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eggdb-operator
rules:
  - apiGroups: ["eggspot.app"]
    resources: ["eggdbs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["eggspot.app"]
    resources: ["eggdbs/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eggdb-operator
subjects:
  - kind: ServiceAccount
    name: eggdb-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eggdb-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eggdb-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eggdb-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eggdb-operator
    spec:
      serviceAccountName: eggdb-operator
      containers:
        - name: operator
          image: ghcr.io/eggspot/eggdb-operator:latest
          env:
            - name: SSL_CERT_FILE
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - name: KUBERNETES_SERVICE_HOST
              value: kubernetes.default.svc
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
