apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: eggdbs.eggspot.app
spec:
  group: eggspot.app
  scope: Namespaced
  names:
    kind: EggDB
    plural: eggdbs
    singular: eggdb
    shortNames: [egg]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Endpoint
          type: string
          jsonPath: .status.endpoint
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [passwordSecret]
              properties:
                image:
                  type: string
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                mysqlPort:
                  type: integer
                  minimum: 1
                  maximum: 65535
                passwordSecret:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                tlsSecret:
                  type: object
                  properties:
                    name:
                      type: string
                storage:
                  type: object
                  properties:
                    size:
                      type: string
                    className:
                      type: string
                resources:
                  type: object
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                readyReplicas:
                  type: integer
                endpoint:
                  type: string
                message:
                  type: string
